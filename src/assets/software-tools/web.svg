<svg
    width="512"
    height="512"
    viewBox="0 0 512 512"
    xmlns="http://www.w3.org/2000/svg"
>
    <defs>
        <!-- Transparent cutouts -->
        <mask id="cutMask">
            <!-- Visible area -->
            <rect width="100%" height="100%" fill="white" />

            <!-- Transparent curved lines -->
            <g
                stroke="black"
                stroke-width="36"
                fill="none"
                stroke-linecap="round"
            >
                <!-- Left vertical -->
                <path
                    d="
                        M 182 20
                        C 150 180, 150 332, 194 492
                    "
                />

                <!-- Right vertical -->
                <path
                    d="
                        M 330 20
                        C 362 180, 362 332, 318 492
                    "
                />

                <!-- Upper horizontal (oval-style inward curve) -->
                <path
                    d="
                        M 24 188
                        C 170 145, 342 145, 488 188
                    "
                />

                <!-- Lower horizontal (oval-style inward curve) -->
                <path
                    d="
                        M 24 324
                        C 170 367, 342 367, 488 324
                    "
                />
            </g>
        </mask>
    </defs>

    <!-- Larger circle -->
    <circle
        cx="256"
        cy="256"
        r="215"
        fill="black"
        mask="url(#cutMask)"
    />
</svg>